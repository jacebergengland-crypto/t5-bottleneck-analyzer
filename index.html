  * { box-sizing: border-box; margin: 0; padding: 0; }

  input[type="number"] { -moz-appearance: textfield; }
  button { font-family: inherit; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }

  #app { min-height: 100vh; display: flex; flex-direction: column; }

  /* Top bar */
  .topBar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; border-bottom: 1px solid #1a1a1a; background: #0d0d0d; flex-wrap: wrap; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.05em; }
  .brandMark { background: #00ffc2; color: #000; padding: 4px 10px; font-weight: 900; border-radius: 999px; }
  .brandDot { color: #00ffc2; animation: pulse 2s infinite; }
  .brandText { color: #888; }
  .statusBar { display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #888; letter-spacing: 0.08em; padding: 6px 14px; background: #1a1a1a; border-radius: 999px; }

  .resetBtn { background: transparent; color: #666; border: 1px solid #2a2a2a; padding: 5px 14px; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; font-family: 'JetBrains Mono', monospace; cursor: pointer; border-radius: 999px; }

  .inputLabel { font-size: 13px; font-weight: 600; color: #e0e0e0; }
  .helpIcon { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; background: #1a1a1a; color: #666; border: none; border-radius: 50%; font-size: 10px; font-weight: 700; font-family: 'JetBrains Mono', monospace; cursor: pointer; transition: all 0.12s; padding: 0; }

  .inputRight { display: flex; align-items: center; gap: 6px; }
  .inputWrap { position: relative; width: 100px; }
  .input { width: 100%; background: #050505; border: 1px solid #2a2a2a; color: #f0f0f0; padding: 8px 24px 8px 14px; font-size: 14px; font-family: 'JetBrains Mono', monospace; font-weight: 700; outline: none; transition: border-color 0.15s; border-radius: 999px; }
  .inputPrefix { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #555; font-family: 'JetBrains Mono', monospace; font-size: 12px; pointer-events: none; }
  .inputSuffix { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #555; font-family: 'JetBrains Mono', monospace; font-size: 12px; pointer-events: none; }
  .tierPill { padding: 4px 10px; font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 800; letter-spacing: 0.08em; min-width: 40px; text-align: center; border-radius: 999px; color: #000; }

  .helpPanel { background: #0a0a0a; border: 1px solid #00ffc2; padding: 14px 16px; margin-bottom: 8px; animation: slideDown 0.18s ease-out; border-radius: 16px; }

  .calcFields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }

  .rootCauseSignal { font-size: 12px; color: #888; font-style: italic; }
  .phasesBlock { margin-bottom: 24px; }

  regRate: { diagnosis: 'List-to-registration under 3% means your promo sequence isn\'t converting subscribers.', sopRef: 'SOP 13 (Email Matrix) + Webinar promo sequence', rootCauses: [{ cause: 'Single-email promo', signal: 'Only 1 email sent about webinar' }, { cause: 'No urgency/scarcity', signal: 'No deadline mentioned' }], phases: [{ name: 'Phase 1 — 4-Email Sequence', actions: ['Email 1: Teaser', 'Email 2: Social proof/case study', 'Email 3: Urgency (spots filling)', 'Email 4: Final call (closing tonight)'] }, { name: 'Phase 2 — Add Scarcity', actions: ['"Only X spots left" in final 24hr', 'Real deadline, not fake urgency', 'Close registration after webinar starts'] }], tools: ['Kit sequences', 'WebinarJam', 'GHL'], expectedLift: '+3-5% reg rate within 1 promo cycle' },

const TIER_GAPS = { critical: 4, poor: 3, average: 2, good: 1, elite: 0 };
const TIER_COLORS = { critical: '#ff3131', poor: '#ff7a00', average: '#ffd60a', good: '#7cff6b', elite: '#00ffc2' };

function getTier(value, benchmark) {
  if (value === null || value === undefined || isNaN(value) || value === '') return null;
  const v = parseFloat(value);
  if (benchmark.inverse) {
    if (v >= benchmark.critical) return 'critical';
    if (v >= benchmark.poor) return 'poor';
    if (v >= benchmark.average) return 'average';
    if (v >= benchmark.good) return 'good';
    return 'elite';
  } else {
    if (v < benchmark.critical) return 'critical';
    if (v < benchmark.poor) return 'poor';
    if (v < benchmark.average) return 'average';
    if (v < benchmark.good) return 'good';
    return 'elite';
  }
}

function formatNumber(val, format) {
  if (!val) return '';
  const n = parseFloat(val);
  if (format === '' && n >= 1000) return n >= 1000000 ? (n / 1000000).toFixed(1) + 'M' : (n / 1000).toFixed(1) + 'K';
  return val;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[s]);
}

// ============ STATE ============
const state = {
  funnelType: 'webinar',
  inputs: {},
  expandedStat: null,
  calcValues: {},
  solvingBottleneck: null,
};

// ============ RENDER ============
function render() {
  const benchmarks = BENCHMARKS[state.funnelType];
  const statKeys = Object.keys(benchmarks);
  const filledCount = statKeys.filter(k => state.inputs[k] !== undefined && state.inputs[k] !== '').length;
  const hasData = filledCount > 0;

  // Run analysis
  const analysis = statKeys.map(key => {
    const val = state.inputs[key];
    const bench = benchmarks[key];
    const tier = getTier(val, bench);
    const meta = STAT_META[key] || { ease: 3, risk: 3, impact: 3 };
    const gap = tier ? TIER_GAPS[tier] : 0;
    const priorityScore = gap > 0 ? (gap * meta.impact * meta.ease) / meta.risk : 0;
    return { key, label: bench.label, value: val, tier, bench, meta, gap, priorityScore };
  }).sort((a, b) => b.priorityScore - a.priorityScore);

  const topBottlenecks = analysis.filter(r => r.priorityScore > 0).slice(0, 3);

  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderModal()}
    <div class="topBar">
      <div class="brand">
        <span class="brandMark">T5</span>
        <span class="brandDot">●</span>
        <span class="brandText">BOTTLENECK.ANALYZER</span>
      </div>
      <div class="statusBar">
        <span class="statusDot"></span>
        <span>${filledCount}/${statKeys.length} STATS</span>
      </div>
    </div>

    <div class="funnelBar">
      ${Object.entries(FUNNEL_CATEGORIES).map(([catKey, cat]) => `
        <div class="funnelGroup">
          <span class="funnelGroupLabel">${cat.label}</span>
          <div class="funnelTabs">
            ${cat.funnels.map(f => `
              <button class="tab ${state.funnelType === f.id ? 'active' : ''}" data-funnel="${f.id}">${f.name}</button>
            `).join('')}
          </div>
        </div>
      `).join('')}
    </div>

    <div class="mainGrid">
      <div class="leftPanel">
        <div class="panelHeader">
          <span class="panelLabel">INPUT STATS</span>
          ${hasData ? '<button class="resetBtn" data-action="reset">RESET</button>' : ''}
        </div>
        <div class="helpHint">
          <span>Click </span><span class="helpIconInline">?</span><span> on any stat to see the formula + calculator</span>
        </div>
        <div class="inputList">
          ${statKeys.map(key => renderInputRow(key, benchmarks[key])).join('')}
        </div>
      </div>

      <div class="rightPanel">
        ${!hasData ? renderEmptyState() : renderResults(analysis, topBottlenecks, statKeys, filledCount)}
      </div>
    </div>

    <div class="footer">
      <span class="footerText">ONE STAT AT A TIME · ATTACK #1 UNTIL FIXED · THEN MOVE TO #2</span>
    </div>
  `;

  attachListeners();
}

function renderInputRow(key, bench) {
  const val = state.inputs[key] || '';
  const tier = getTier(val, bench);
  const formula = FORMULAS[key];
  const calculator = CALCULATORS[key];
  const isExpanded = state.expandedStat === key;
  const cv = state.calcValues[key] || {};
  const calcResult = calculator ? calculator.calc(cv) : 0;

  const borderColor = tier ? TIER_COLORS[tier] : '#2a2a2a';
  const paddingLeft = bench.format === '$' ? '22px' : '14px';

  return `
    <div class="inputRowWrapper">
      <div class="inputRow">
        <div class="inputRowLeft">
          <div class="inputLabelWrap">
            <span class="inputLabel">${escapeHtml(bench.label)}</span>
            ${formula ? `<button class="helpIcon ${isExpanded ? 'active' : ''}" data-help="${key}" title="Show formula & calculator">?</button>` : ''}
          </div>
          <div class="inputBench">GOOD: ${bench.inverse ? '&lt;' + bench.good : bench.good + '+'}${bench.format}</div>
        </div>
        <div class="inputRight">
          <div class="inputWrap">
            ${bench.format === '$' ? '<span class="inputPrefix">$</span>' : ''}
            <input type="number" step="0.01" value="${val}" data-input="${key}" placeholder="—" class="input" style="padding-left: ${paddingLeft}; border-color: ${borderColor};">
            ${(bench.format === '%' || bench.format === 'x') ? `<span class="inputSuffix">${bench.format}</span>` : ''}
          </div>
          ${tier ? `<div class="tierPill" style="background: ${TIER_COLORS[tier]};">${tier.toUpperCase().slice(0, 4)}</div>` : ''}
        </div>
      </div>
      ${isExpanded && formula ? renderHelpPanel(key, formula, calculator, cv, calcResult, bench) : ''}
    </div>
  `;
}

function renderHelpPanel(key, formula, calculator, cv, calcResult, bench) {
  return `
    <div class="helpPanel">
      <div class="helpSection">
        <div class="helpSectionLabel">FORMULA</div>
        <div class="helpFormula">${escapeHtml(formula.formula)}</div>
      </div>
      <div class="helpSection">
        <div class="helpSectionLabel">WHERE TO FIND</div>
        <div class="helpText">${escapeHtml(formula.where)}</div>
      </div>
      ${formula.note ? `
        <div class="helpSection">
          <div class="helpSectionLabel">NOTE</div>
          <div class="helpText">${escapeHtml(formula.note)}</div>
        </div>
      ` : ''}
      ${calculator ? `
        <div class="calcSection">
          <div class="helpSectionLabel">CALCULATE IT</div>
          <div class="calcFields">
            ${calculator.fields.map(f => `
              <div class="calcField">
                <label class="calcLabel">${escapeHtml(f.label)}</label>
                <div class="calcInputWrap">
                  ${f.prefix ? `<span class="calcPrefix">${f.prefix}</span>` : ''}
                  <input type="number" step="0.01" value="${cv[f.key] || ''}" data-calc="${key}" data-field="${f.key}" placeholder="0" class="calcInput" style="padding-left: ${f.prefix ? '20px' : '10px'};">
                </div>
              </div>
            `).join('')}
          </div>
          ${calcResult > 0 ? `
            <div class="calcResult">
              <span class="calcResultLabel">=</span>
              <span class="calcResultValue">${bench.format === '$' ? '$' : ''}${calcResult.toFixed(2)}${bench.format === '%' ? '%' : ''}${bench.format === 'x' ? 'x' : ''}</span>
              <button class="applyBtn" data-apply="${key}">USE THIS →</button>
            </div>
          ` : ''}
        </div>
      ` : ''}
    </div>
  `;
}

function renderEmptyState() {
  return `
    <div class="emptyState">
      <div class="emptyMark">→</div>
      <div class="emptyTitle">PLUG IN YOUR STATS</div>
      <div class="emptyText">Input your metrics on the left. Click the "?" icon for formulas and a built-in calculator if you need help finding a stat.</div>
    </div>
  `;
}

function renderResults(analysis, topBottlenecks, statKeys, filledCount) {
  return `
    <div class="panelHeader">
      <span class="panelLabel">SCORECARD</span>
      <span class="panelSubLabel">${filledCount} of ${statKeys.length} tracked</span>
    </div>
    <div class="scorecard">
      ${analysis.filter(r => r.tier).map(r => `
        <div class="scoreRow">
          <div class="scoreLabel">${escapeHtml(r.label)}</div>
          <div class="scoreBarWrap">
            <div class="scoreBarFill" style="width: ${Math.min(100, (1 - (r.gap / 4)) * 100)}%; background: ${TIER_COLORS[r.tier]};"></div>
          </div>
          <div class="scoreValue">${r.bench.format === '$' ? '$' : ''}${formatNumber(r.value, r.bench.format)}${r.bench.format === '%' ? '%' : ''}${r.bench.format === 'x' ? 'x' : ''}</div>
        </div>
      `).join('')}
    </div>

    <div class="panelHeader" style="margin-top: 20px;">
      <span class="panelLabel">ATTACK MODE · TOP BOTTLENECKS</span>
    </div>

    ${topBottlenecks.length === 0 ? `
      <div class="allGood">
        <div class="allGoodTitle">NO BOTTLENECKS.</div>
        <div class="allGoodText">All tracked stats at Good/Elite tier. Scale the spend.</div>
      </div>
    ` : `
      <div class="bottleneckList">
        ${topBottlenecks.map((r, idx) => renderBottleneckCard(r, idx)).join('')}
      </div>
    `}
  `;
}

function renderBottleneckCard(r, idx) {
  const pb = PLAYBOOKS[r.key] || { substats: [], tests: [], warning: '' };
  const hasSolvePlan = !!SOLVE_PLANS[r.key];

  return `
    <div class="bnCard">
      <div class="bnTop">
        <div class="bnRank">#${idx + 1}</div>
        <div class="bnInfo">
          <div class="bnTitle">${escapeHtml(r.label)}</div>
          <div class="bnMeta">
            <span style="color: ${TIER_COLORS[r.tier]};">${formatNumber(r.value, r.bench.format)}${r.bench.format === '%' ? '%' : r.bench.format === 'x' ? 'x' : ''} · ${r.tier.toUpperCase()}</span>
            <span class="bnMetaDivider">|</span>
            <span>TARGET: ${r.bench.inverse ? '&lt;' + r.bench.good : r.bench.good + '+'}${r.bench.format === '%' ? '%' : r.bench.format === 'x' ? 'x' : ''}</span>
            <span class="bnMetaDivider">|</span>
            <span>SCORE: ${r.priorityScore.toFixed(1)}</span>
          </div>
        </div>
      </div>
      <div class="bnBody">
        <div class="bnCol">
          <div class="bnColLabel">INVESTIGATE</div>
          ${pb.substats.map(s => `<div class="bnItem">· ${escapeHtml(s)}</div>`).join('')}
        </div>
        <div class="bnCol">
          <div class="bnColLabel">TEST THIS WEEK</div>
          ${pb.tests.map(t => `<div class="bnItem">→ ${escapeHtml(t)}</div>`).join('')}
        </div>
      </div>
      ${pb.warning ? `
        <div class="bnWarning">
          <span class="bnWarningLabel">RISK:</span> ${escapeHtml(pb.warning)}
        </div>
      ` : ''}
      ${hasSolvePlan ? `<button class="solveBtn" data-solve="${r.key}">SOLVE THIS BOTTLENECK →</button>` : ''}
    </div>
  `;
}

function renderModal() {
  if (!state.solvingBottleneck) return '';

  const benchmarks = BENCHMARKS[state.funnelType];
  const val = state.inputs[state.solvingBottleneck];
  const bench = benchmarks[state.solvingBottleneck];
  if (!bench) return '';
  const tier = getTier(val, bench);
  const plan = SOLVE_PLANS[state.solvingBottleneck];
  if (!plan) return '';

  return `
    <div class="modalOverlay" data-close-modal>
      <div class="modalContainer" data-stop>
        <div class="modalHeader">
          <div>
            <div class="modalLabel">SOLVING BOTTLENECK</div>
            <div class="modalTitle">${escapeHtml(bench.label)}</div>
            <div class="modalMeta">
              <span style="color: ${TIER_COLORS[tier] || '#888'};">
                ${val}${bench.format === '%' ? '%' : bench.format === 'x' ? 'x' : ''} · ${tier ? tier.toUpperCase() : 'N/A'}
              </span>
              <span class="modalDivider">→</span>
              <span style="color: ${TIER_COLORS.good};">
                TARGET: ${bench.inverse ? '&lt;' + bench.good : bench.good + '+'}${bench.format === '%' ? '%' : bench.format === 'x' ? 'x' : ''}
              </span>
            </div>
          </div>
          <button class="modalClose" data-close-modal>✕</button>
        </div>
        <div class="modalBody">
          <div class="diagnosisBlock">
            <div class="blockLabel">DIAGNOSIS</div>
            <div class="diagnosisText">${escapeHtml(plan.diagnosis)}</div>
            <div class="sopRef">REFERENCE: ${escapeHtml(plan.sopRef)}</div>
          </div>

          <div class="rootCausesBlock">
            <div class="blockLabel">ROOT CAUSES · MATCH THE SIGNAL TO YOUR REALITY</div>
            ${plan.rootCauses.map(rc => `
              <div class="rootCauseRow">
                <div class="rootCauseName">${escapeHtml(rc.cause)}</div>
                <div class="rootCauseSignal">→ ${escapeHtml(rc.signal)}</div>
              </div>
            `).join('')}
          </div>

          <div class="phasesBlock">
            <div class="blockLabel">EXECUTION PLAN</div>
            ${plan.phases.map((phase, i) => `
              <div class="phaseCard">
                <div class="phaseHeader">
                  <div class="phaseNumber">${i + 1}</div>
                  <div class="phaseName">${escapeHtml(phase.name)}</div>
                </div>
                <div class="phaseActions">
                  ${phase.actions.map(action => `
                    <div class="phaseAction">
                      <span class="phaseBullet">→</span>
                      <span>${escapeHtml(action)}</span>
                    </div>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>

          <div class="footerBlock">
            <div class="footerColLabel">TOOLS NEEDED</div>
            <div class="toolsList">
              ${plan.tools.map(t => `<span class="toolPill">${escapeHtml(t)}</span>`).join('')}
            </div>
            <div class="expectedLift">
              <span class="liftLabel">EXPECTED LIFT:</span> ${escapeHtml(plan.expectedLift)}
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

// ============ EVENT HANDLERS ============
function attachListeners() {
  // Funnel tabs
  document.querySelectorAll('[data-funnel]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.funnelType = btn.dataset.funnel;
      state.inputs = {};
      state.calcValues = {};
      state.expandedStat = null;
      render();
    });
  });

  // Reset
  document.querySelectorAll('[data-action="reset"]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.inputs = {};
      state.calcValues = {};
      state.expandedStat = null;
      render();
    });
  });

  // Input changes
  document.querySelectorAll('[data-input]').forEach(input => {
    input.addEventListener('input', (e) => {
      state.inputs[e.target.dataset.input] = e.target.value;
      render();
      // Restore focus
      const restored = document.querySelector(`[data-input="${e.target.dataset.input}"]`);
      if (restored) {
        restored.focus();
        const len = restored.value.length;
        restored.setSelectionRange(len, len);
      }
    });
  });

  // Help toggle
  document.querySelectorAll('[data-help]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.help;
      state.expandedStat = state.expandedStat === key ? null : key;
      render();
    });
  });

  // Calculator inputs
  document.querySelectorAll('[data-calc]').forEach(input => {
    input.addEventListener('input', (e) => {
      const statKey = e.target.dataset.calc;
      const fieldKey = e.target.dataset.field;
      if (!state.calcValues[statKey]) state.calcValues[statKey] = {};
      state.calcValues[statKey][fieldKey] = parseFloat(e.target.value) || 0;
      render();
      const restored = document.querySelector(`[data-calc="${statKey}"][data-field="${fieldKey}"]`);
      if (restored) {
        restored.focus();
        const len = restored.value.length;
        restored.setSelectionRange(len, len);
      }
    });
  });

  // Apply calculated value
  document.querySelectorAll('[data-apply]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.apply;
      const calc = CALCULATORS[key];
      if (!calc) return;
      const result = calc.calc(state.calcValues[key] || {});
      if (result > 0) {
        state.inputs[key] = result.toFixed(2);
        state.expandedStat = null;
        render();
      }
    });
  });

  // Solve button
  document.querySelectorAll('[data-solve]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.solvingBottleneck = btn.dataset.solve;
      render();
    });
  });

  // Close modal
  document.querySelectorAll('[data-close-modal]').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target === el) {
        state.solvingBottleneck = null;
        render();
      }
    });
  });

  document.querySelectorAll('[data-stop]').forEach(el => {
    el.addEventListener('click', (e) => e.stopPropagation());
  });
}

// ============ INIT ============
render();
</script>
</body>
</html>
